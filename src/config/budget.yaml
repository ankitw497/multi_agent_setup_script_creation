# Local budget policy (plan §3.2, §4, Appendix G #9). Enforced in llm/budget.py —
# never delegated to a provider or LiteLLM helper. Three tiers per format: the
# target guides tiering/escalation, the warning logs and caps status at
# PASS_WARN, the hard cap aborts (pre-flight) or stops-and-checkpoints (mid-run).

longform:
  target_usd: 0.40
  warning_usd: 0.60
  hard_cap_usd: 1.00

short:
  target_usd: 0.08
  warning_usd: 0.15
  hard_cap_usd: 0.25

daily:
  target_usd: 5.00
  warning_usd: 5.00
  hard_cap_usd: 10.00

abort_on_exceed: true
