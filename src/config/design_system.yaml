# One channel component library, one theme (plan §7). Tokens and component
# skeletons lifted verbatim from docs/corpus/sample_outputs/ -- specifically
# the 17 classes verified present across ALL THREE different-topic sample
# pages (callout, callout-info, callout-neutral, callout-text, card, card-sm,
# grid-2, hero-badge2, nav-main, reveal, sec-alt, sec-wrap, section-sub,
# section-title, ...), never a single video's bespoke one-off styling (e.g.
# video-1.1's arch-compare/bw-bars/precision-cards are CPU/GPU-specific and
# deliberately excluded -- this is supposed to be a component library, not
# one video's stylesheet). `math_block` and `diagram_card` are the two
# exceptions: adapted from the "guide" markup family (extraction/profiles/
# guide.py) since the sample_outputs corpus (a GPU/memory series) never
# needed an equation or a labeled diagram placeholder, but real content
# (e.g. attention) does.
#
# Manual component additions only (plan §7) -- automatic fitting from
# arbitrary references is V1D.
#
# fonts.sans is the real Apple system stack (2026-09-11 fix, matching the
# source corpus's own `--font` value verbatim), not an external Google Font
# -- headline components (`hero-title`/`section-title`/`card-value`) render
# in it, never in `fonts.serif`, which stays available for a future
# editorial-accent use the way the guide corpus uses it (an italic
# sub-headline only), never for an actual headline.

tokens:
  colors:
    bg: "#f5f5f7"
    bg2: "#ffffff"
    bg3: "#e8e8ed"
    text: "#1d1d1f"
    text2: "#424245"
    # text3 was #6e6e73 -- a real, systemic 4.15:1 contrast against bg3
    # (#e8e8ed), just under WCAG AA's 4.5:1 for normal text. Found live
    # 2026-09-11: it survived 2 real H-repair attempts every single run,
    # because a content regeneration can never fix a CSS color choice --
    # exactly the "unrepairable via content" case verification/hard/
    # render_rendered.py's contrast check was designed to catch. Darkened
    # to #64646a (4.81:1 against bg3), a barely-perceptible change that can
    # only improve contrast against any of this system's other, lighter
    # backgrounds too.
    text3: "#64646a"
    accent: "#0071e3"
    accent2: "#34c759"
    accent3: "#ff3b30"
    accent4: "#ff9f0a"
    accent5: "#af52de"
    border: "rgba(0,0,0,0.08)"
  fonts:
    serif: "'Literata',Georgia,serif"
    sans: "-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif"
  radii:
    r: "18px"
    r_sm: "10px"
  shadows:
    shadow: "0 2px 20px rgba(0,0,0,0.08)"
    shadow_lg: "0 8px 40px rgba(0,0,0,0.12)"

# story_roles: plan §7's table, mapped onto the real generic vocabulary
# above. A beat/scene's own `archetype_role`/`narrative_beat` selects a
# story role here; the H pass (html_synth/synthesizer.py) then picks a
# specific component from that role's list per scene, matching visual_importance.
story_roles:
  # PIPELINE_AUDIT_2026-09-17.md finding #2: "hero" is declared below as "One per page,
  # always the first section" and html_synth/assembler.py already renders exactly one,
  # unconditionally, before any beat content -- offering it here let the H pass pick it
  # AGAIN for an ordinary hook-beat scene, producing a real duplicate id="hero-story"
  # that verification/hard/render.py::check_unique_ids catches but can never attribute to
  # a scene_id, making it permanently unrepairable. A page-singleton component must never
  # also be a per-scene choice -- "card" alone covers the hook role correctly.
  hook: [card]
  # suspect_board added 2026-09-26 (Phase 31 item 3): a lineup of candidate causes is
  # exactly the shape a contradiction/investigation beat needs for a sustained mystery
  # archetype, matching Phase 31 item 2's sustained-narrative-heading fix for the same
  # archetype family -- previously only a plain callout/grid was available.
  contradiction: [callout_danger, grid_2, suspect_board]
  investigation: [step_list, grid_3, suspect_board]
  # 2026-09-24: diagram_card added here too -- confirmed live (Opus 5.5 story_lead
  # comparison run) that a "build"-archetype plan can tag NEARLY HALF its beats
  # problem_fix (6/13 in the real plan), and this was the one role Phase 27's own fix
  # below missed: it had zero diagram-capable options, so a build-archetype video's
  # problem->fix chain -- which very often IS a mechanism/pipeline/equation, the exact
  # content diagram_card exists for -- got locked into step_list/callout_warn only,
  # regardless of what the "fix" actually was. Same reasoning as Phase 27 item 1 below,
  # just the one role that fix didn't reach.
  # case_card added 2026-09-26 (Phase 32 P1): confirmed live -- problem_fix is the
  # single most-repeated role in a real build-archetype plan (3-4 of ~11-12 beats),
  # and "here's a specific problem, here's its specific fix" is a near-verbatim match
  # for case_card's own "here's a specific instance of the general rule" shape (already
  # offered to mechanism/observations). Two real generated pages used diagram_card for
  # every single problem_fix scene (31-33 uses each) and never had this alternative
  # available at all.
  problem_fix: [step_list, callout_warn, diagram_card, case_card]
  mechanism: [card, diagram_card, math_block, case_card]
  # STORY_IMPROVEMENT_PLAN.md Phase 27 item 1: diagram_card added to comparison/derivation/
  # payoff -- confirmed live (v05) that H picks diagram_card 83% of the time where it's
  # actually offered (5/6 mechanism-role scenes), so the real gap was never H avoiding it;
  # most mechanism-SHAPED content in a real video gets tagged one of these other roles
  # (e.g. a beat landing the assembled equation is legitimately "payoff", not "mechanism",
  # but a multi-stage pipeline is still exactly what diagram_card is for) and had no access
  # to it at all. Real missed example: a payoff-role scene narrating "QK^T matches... divide
  # by sqrt(d_k)... softmax... multiply by V" rendered as a plain card solely because
  # payoff's allowlist excluded diagrams.
  comparison: [grid_2, metric_table, card, diagram_card]
  derivation: [math_block, card, diagram_card]
  # case_card added 2026-09-26 (Phase 31 item 3): "here's a specific instance of the
  # general rule" is a real, distinct shape from a raw observations grid.
  observations: [grid_3, defbox, case_card]
  # solution_grid added 2026-09-26 (Phase 31 item 3): a payoff that resolves into several
  # concrete options (not one) is a real, distinct shape from a single callout/card.
  payoff: [callout_success, card, diagram_card, solution_grid]

components:
  hero:
    description: "Full-bleed opening -- the hook. One per page, always the first section."
    slots: [badge, title, subtitle]
    skeleton: |
      <div id="hero-story" class="sec-wrap">
      <div class="hero-inner">
        <div class="hero-badge2">{badge}</div>
        <h1 class="hero-title">{title}</h1>
        <p class="hero-subtitle">{subtitle}</p>
      </div>
      </div>

  callout_info:
    description: "Neutral supporting note."
    slots: [text]
    skeleton: |
      <div class="callout callout-info"><div class="callout-text">{text}</div></div>

  callout_warn:
    description: "A problem or caveat about to be addressed (problem->fix chains)."
    slots: [text]
    skeleton: |
      <div class="callout callout-warn"><div class="callout-text">{text}</div></div>

  callout_danger:
    description: "A real failure or contradiction (mystery/contradiction beats)."
    slots: [text]
    skeleton: |
      <div class="callout callout-danger"><div class="callout-text">{text}</div></div>

  callout_success:
    description: "A resolved payoff or capstone."
    slots: [text]
    skeleton: |
      <div class="callout callout-success"><div class="callout-text">{text}</div></div>

  card:
    description: "One concrete value/fact/comparison point."
    slots: [title, value, desc]
    skeleton: |
      <div class="card">
        {title_block}{value_block}{desc_block}
      </div>

  grid_2:
    description: "Two-up comparison (before/after, contrast rows)."
    slots: [items]  # list of {title, value, desc} dicts, exactly 2 -- rendered as mini-cards
    skeleton: |
      <div class="grid-2">{items}</div>

  grid_3:
    description: "Three-up grid (observations, elimination/candidate grids)."
    slots: [items]  # list of {title, value, desc} dicts -- rendered as mini-cards
    skeleton: |
      <div class="grid-3">{items}</div>

  step_list:
    description: "An ordered sequence -- problem/fix chains, investigation steps, derivations."
    slots: [items]  # list of {title, desc}
    skeleton: |
      <div class="step-list">{items}</div>
    item_skeleton: |
      <div class="step-item"><div class="step-num">{index}</div><div>
        <div class="step-title">{title}</div>
        {desc_block}</div></div>

  defbox:
    description: "One term + definition (observations/framework beats)."
    slots: [term, body]
    skeleton: |
      <div class="defbox">
        <div class="defbox-term">{term}</div>
        <div class="defbox-body">{body}</div>
      </div>

  math_block:
    description: "One equation with a plain-language label (derivation/mechanism beats). Adapted from the guide markup family -- not in the sample_outputs corpus, needed for real technical content."
    slots: [label, equation]
    skeleton: |
      <div class="math-block">
        <div class="math-block-label">{label}</div>
        <div class="math-block-equation">{equation}</div>
      </div>

  diagram_card:
    description: "A compact ASCII-art diagram (arrows/boxes/labels) illustrating one concrete mechanism step, with a one-line caption -- real content, not a placeholder. Adapted from the guide markup family's own diagram-card + code-pre pattern (2026-09-11: the original placeholder-only version never actually drew anything)."
    slots: [content, caption]
    skeleton: |
      <div class="diagram-card">
        <pre class="diagram-pre">{content}</pre>
        <footer class="diagram-caption">{caption}</footer>
      </div>

  metric_table:
    description: "A real comparison table (comparison beats)."
    slots: [headers, rows]  # headers: list[str]; rows: list[list[str]]
    skeleton: |
      <table class="metric-table">
        <thead><tr>{header_cells}</tr></thead>
        <tbody>{body_rows}</tbody>
      </table>

  # 2026-09-26: STORY_IMPROVEMENT_PLAN.md Phase 31 item 3 -- 3 devices real reference pages
  # used with no equivalent here, each mapping to a real narrative shape this project's
  # own archetypes already support but previously rendered with a generic card/grid.
  suspect_board:
    description: "A lineup of candidate causes, each with a one-line description -- sustained mystery/investigation beats (contradiction, investigation roles). Never a resolution -- the reveal belongs in a later scene's own component."
    slots: [items]  # list of {name, note} -- one suspect per item
    skeleton: |
      <div class="suspect-board">{items}</div>
    item_skeleton: |
      <div class="suspect"><div class="suspect-name">{name}</div>{note_block}</div>

  solution_grid:
    description: "N labeled fix-options compared side by side -- a payoff that resolves into multiple concrete options rather than one (payoff role only)."
    slots: [items]  # list of {name, body} -- one option per item
    skeleton: |
      <div class="solution-grid">{items}</div>
    item_skeleton: |
      <div class="solution-card"><div class="solution-name">{name}</div>{body_block}</div>

  case_card:
    description: "One labeled concrete scenario/example -- 'here's a specific instance of the general rule' (observations, mechanism roles)."
    slots: [title, sub, body]
    skeleton: |
      <div class="case-card">
        <div class="case-title">{title}</div>
        {sub_block}{body_block}
      </div>
