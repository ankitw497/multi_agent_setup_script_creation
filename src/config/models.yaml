# Model aliases — never hard-code a provider model id in story logic (plan §2.3).
# `resolved` is what the backend actually calls; `verified` records whether we
# have observed a real successful call against this exact id (plan Appendix E #8:
# pin the exact model, assert the resolved id, never trust a moving alias).

subscription_lane:
  sonnet:
    resolved: "claude-sonnet-5"
    verified: true          # confirmed 2026-09-10 via llm/backends/claude_cli.py.
                            # IMPORTANT: pass the exact id below, never the shorthand
                            # "sonnet" — a single `-p --model sonnet` call was observed
                            # to also log an internal claude-haiku-4-5-20251001 entry
                            # in the envelope's modelUsage; the backend now identifies
                            # the real resolved model from top-level usage token counts
                            # (not dict order), but the CLI must still be CALLED with
                            # this exact id for the pinning assertion to hold.
  haiku:
    resolved: "claude-haiku-4-5-20251001"
    verified: true          # confirmed 2026-09-10 via llm/backends/claude_cli.py

paid_api_lane:
  openai_story_strong:
    # 2026-09-16: no longer the DEFAULT `story_lead` "strong" tier alias (that's now
    # openai_story_strong_gpt56 below) -- kept fully configured here as the rollback
    # option (`--story-lead-alias openai_story_strong`), not removed.
    resolved: "gpt-4o"
    max_tokens: 4000        # moved here from story_planner.py's own hardcoded A2 override
                            # (2026-09-11) so a different story_lead alias (e.g. the
                            # reasoning-capable gpt-5.6-sol below) can carry its OWN
                            # ceiling instead of inheriting gpt-4o's. Same value, same
                            # behavior as before this move -- see ERR-021 for why 4000
                            # (raised from a 2048 default that truncated a full StoryPlan).
    verified: true          # confirmed 2026-09-10 across several real A2/A3 calls.
                            # Not a reasoning model (litellm.supports_reasoning("gpt-4o")
                            # is False, unlike e.g. "o3-mini") -- no reasoning_effort
                            # to set, and a real truncation found on this call (ERR-021)
                            # was genuine output-length truncation, fixed by raising
                            # max_tokens, not a hidden-reasoning-budget issue. Re-check
                            # supports_reasoning() if this alias is ever repointed at a
                            # reasoning-capable model.
  openai_story_mini:
    resolved: "gpt-4o-mini"
    verified: true          # confirmed working 2026-09-10: 12 in / 1 out tokens, $0.0000024
  openai_story_strong_gpt56:
    resolved: "gpt-5.6-sol"
    reasoning_effort: "medium"  # 2026-09-11 STORY_IMPROVEMENT_PLAN.md Phase 4 fix: a real
                            # A2 call with this LEFT UNSET (relying on the provider default,
                            # which litellm's own model_cost map confirms IS "medium" for
                            # this model) still burned the ENTIRE 4000-token max_tokens
                            # ceiling on hidden reasoning against a real, complex A2 prompt
                            # (13.7k input tokens) -- output.beats came back empty
                            # (StoryStructure's own pydantic defaults, never actually
                            # generated), and the run FAILed after exhausting its replan
                            # budget, at ~$0.28 wasted on the two empty A2 calls alone.
                            # `reasoning_effort` and `max_tokens` (below) are NOT
                            # independent controls here -- litellm/OpenAI's own
                            # max_tokens is a COMBINED ceiling over hidden reasoning +
                            # visible output tokens for a reasoning model, confirmed via
                            # litellm.model_cost["gpt-5.6-sol"] (supports_reasoning=true,
                            # $4/1M input, $20/1M output -- reasoning tokens bill at the
                            # OUTPUT rate, no separate reasoning price). Pinned explicitly
                            # here (matching the provider default) rather than left unset,
                            # per this project's own "pin the exact config, never trust an
                            # implicit default" discipline (plan Appendix E #8).
    max_tokens: 10000       # raised from the inherited 4000 (see reasoning_effort comment
                            # above) specifically so reasoning + the actual StoryStructure
                            # JSON can both fit -- confirmed sufficient across the two real
                            # comparison runs on record (model-b/model-c, $0.39-$0.67 total
                            # story_lead spend, well under the longform loop's own $2.00 hard
                            # cap), but still worth watching on the next live run now that
                            # it's the default rather than an opt-in comparison.
    verified: true          # confirmed 2026-09-11: reasoning-capable (litellm.supports_
                            # reasoning() is True, unlike gpt-4o).
                            # 2026-09-16 (explicit user decision): now the DEFAULT `story_lead`
                            # "strong" tier alias (agents/story_lead.py::make_story_lead). This
                            # OVERRIDES Phase 4's own completed comparison (STORY_IMPROVEMENT_
                            # PLAN.md), which found gpt-5.6-sol produced a structurally LESS
                            # coherent plan (2 genuine coherence hard failures gpt-4o didn't
                            # have) for 65% MORE cost, and explicitly said not to promote it.
                            # The user was shown that finding directly and chose to proceed.
                            # `openai_story_strong` (gpt-4o) remains fully configured below for
                            # rollback via `--story-lead-alias openai_story_strong`.
  gemini_review_strong:
    resolved: "gemini/gemini-3.1-pro-preview"
    verified: true            # confirmed 2026-09-10, $0.001128 for a 6 in/93 out call
                              # (92 of those were reasoning tokens — expected and wanted
                              # for this tier). NOTE: "-preview" in the id means Google
                              # can retire/rename this one too; re-verify via the
                              # ListModels probe below if it starts 404ing again.
    reasoning_effort: "low"   # bounded, not unlimited (2026-09-10 cost-discipline pass):
                              # leaving this null means "provider default" reasoning
                              # depth, which is unbounded and was driving real cost on
                              # every C1/C2a/C2b call in the live e2e run ($0.22 for 11
                              # calls). "low" keeps judgement quality for adversarial
                              # review while capping reasoning-token spend.
    max_tokens: 12000         # PIPELINE_AUDIT_2026-09-17.md finding #9: ERR-079/ERR-081
                              # found this alias's own C2a call truncating mid-response at
                              # the backend's bare 4096 default once web search made each
                              # verdict far more verbose, and patched it with a per-call
                              # override scoped ONLY to that one call site (facts/verify.py).
                              # C1 (review/story_critic.py) and C2b's own escalation calls
                              # go through this SAME alias with no override at all -- still
                              # exposed to the identical truncation risk. Set here instead,
                              # at the alias level, so every call through this tier gets the
                              # same protection (matches openai_story_strong_gpt56's own
                              # precedent: a reasoning-capable model's max_tokens is a
                              # combined budget over hidden reasoning + visible output, not
                              # just the JSON, so 4096 was never a safe default for it).
  gemini_review_flash:
    resolved: "gemini/gemini-3.6-flash"
    verified: true            # confirmed 2026-09-10, $0.00000825 for a 6 in/1 out call
                              # WITH reasoning_effort: none. Without it, this model
                              # reasons by default and burned 95 of 96 output tokens on
                              # hidden reasoning for a one-word answer ($0.0003645 for
                              # nothing) — always set reasoning_effort for this tier.
    reasoning_effort: "none"  # required for cheap-tier cost to actually be cheap

  # Both ids above replace what this plan originally guessed (gemini-1.5-*), which
  # turned out to be fully retired. Google's own 404 responses named the exact
  # replacement each time (self-documenting deprecation — nice). If Gemini calls
  # start 404ing in the future, re-run this probe rather than guessing a model id:
  #   GET https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY
  #   -> filter supportedGenerationMethods for "generateContent"
  # The original 403 API_KEY_SERVICE_BLOCKED (2026-09-10, before the key was fixed
  # on the Google Cloud side) is a separate, now-resolved issue — see git history.

# Escalation pairs (plan §4.1 tiering: cheap by default, escalate on a flagged issue).
escalation:
  A3: { default: openai_story_mini, escalate_to: openai_story_strong }
  A4: { default: openai_story_mini, escalate_to: openai_story_strong }
  C3: { default: gemini_review_flash, escalate_to: gemini_review_strong }
  C4b: { default: gemini_review_flash, escalate_to: gemini_review_strong }
  C5: { default: gemini_review_flash, escalate_to: gemini_review_strong }
